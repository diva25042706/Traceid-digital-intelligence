version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: traceid_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./traceid.db
      - SOURCE_RELIABILITY_DEFAULT=HIGH
      - TWINGUARD_AMBIGUITY_THRESHOLD=0.75
    volumes:
      - ./backend:/app
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: traceid_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      - backend
    restart: unless-stopped
